name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  WANDB_DISABLED: "true"
  TF_CPP_MIN_LOG_LEVEL: "3"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --no-cache-dir pip
          # Resolve test tools and the legacy environment together. Pytest 9
          # requires a newer packaging than the legacy environment pins.
          grep -v -E '^(tensorflow-intel|pathtools|seqeval)==' requirements.txt > "${RUNNER_TEMP}/requirements-ci.txt"
          python -m pip install --no-cache-dir -r "${RUNNER_TEMP}/requirements-ci.txt" "flake8==7.5.0" "pytest==8.3.5"
          python -m pip check

      - name: Lint with flake8
        run: |
          flake8 . --ignore=E501 --max-line-length=120

      - name: Run tests
        run: |
          pytest tests/
