name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  WANDB_DISABLED: "true"
  TF_CPP_MIN_LOG_LEVEL: "3"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --no-cache-dir pip
          python -m pip install --no-cache-dir torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir ".[dev,ml]"
          python -m pip check

      - name: Smoke test active imports and CLI
        run: |
          python -c "import syntaxbench.dataset, syntaxbench.train, syntaxbench.evaluation, syntaxbench.transformer"
          python code/main.py --help
          syntaxbench --help

      - name: Verify wheel and editable installs outside checkout
        run: |
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/wheels"
          python -m venv --system-site-packages "$RUNNER_TEMP/package-venv"
          venv="$RUNNER_TEMP/package-venv/bin"
          "$venv/python" -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/wheels/*.whl
          cd "$RUNNER_TEMP"
          "$venv/syntaxbench" --help
          "$venv/python" -c 'import syntaxbench.dataset; print(syntaxbench.dataset.__file__)'
          "$venv/python" -m pip install --no-deps -e "$GITHUB_WORKSPACE"
          "$venv/syntaxbench" --help
          "$venv/python" -c 'import syntaxbench.dataset; print(syntaxbench.dataset.__file__)'

      - name: Lint with flake8
        run: |
          flake8 . --ignore=E501 --max-line-length=120

      - name: Run tests
        run: |
          pytest tests/
