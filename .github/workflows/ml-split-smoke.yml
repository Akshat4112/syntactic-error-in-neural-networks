name: ML split smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/syntaxbench/train.py'
      - 'src/syntaxbench/dataset.py'
      - 'tests/test_ml_split_runtime.py'
      - '.github/workflows/ml-split-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'src/syntaxbench/train.py'
      - 'src/syntaxbench/dataset.py'
      - 'tests/test_ml_split_runtime.py'
      - '.github/workflows/ml-split-smoke.yml'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MPLBACKEND: Agg
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      WANDB_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev,ml]'
      - run: python -c "import tensorflow, transformers, gensim, datasets, evaluate"
      - run: python -m pytest -v tests/test_ml_split_runtime.py
